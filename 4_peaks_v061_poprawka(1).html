<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14283c"><title>14 Peaks v0.6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10243a;color:#fff;font:14px system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}#ui{position:fixed;top:env(safe-area-inset-top);left:0;right:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;text-shadow:1px 2px #142338;font-weight:800}#right{text-align:right}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#081727b8;padding:20px}#panel{max-width:360px;background:#1d354c;border:3px solid #a4c8d8;padding:20px;text-align:center;box-shadow:7px 7px #081727}button{font:700 17px system-ui;padding:12px 22px;background:#e7b75c;color:#162637;border:0;cursor:pointer}small{line-height:1.6;display:block;color:#d2e1e9;margin:12px 0}#hint{position:fixed;bottom:16px;width:100%;text-align:center;pointer-events:none;color:#e4edf5;text-shadow:1px 2px #10243a;font-size:12px}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="left"></div><div id="right"></div></div><div id="hint">Przesuń palcem ↗ ↑ ↖ — długość = siła • gesty ← → korygują lot</div><div id="overlay"><div id="panel"><h1>🏔 14 PEAKS</h1><p>ARCADE • v0.6.1</p><small>Gest ukośnie w górę = skok i kierunek. Dłuższy gest = mocniejszy skok. Przesuwaj palcem w bok, by sterować w locie. Kamera rusza przy pierwszym skoku. Obozy zatrzymują czas. Masz 5 ratunków.</small><button id="start">START</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),uiL=document.getElementById('left'),uiR=document.getElementById('right'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');const W=360,H=640,PH=46;let scale=1,ox=0,oy=0;function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();let platforms=[],player,camera,started,paused,dead,hooks,score,bestHeight,combo,comboFloors,comboTime,checkpoint,lastCamp,elapsed,scrollSpeed,flash='',flashTime=0,gesture=null,queued=null,acc=0,last=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const rand=n=>{let x=Math.sin(n*127.1+13.7)*43758.5453;return x-Math.floor(x)};
function makeWorld(){platforms=[];platforms.push({x:75,y:570,w:210,camp:true,level:0});for(let i=1;i<=220;i++){let y=570-i*PH;let x=24+rand(i)*230,w=82+rand(i+300)*40;platforms.push({x,y,w,camp:i%25===0,level:i});}platforms.sort((a,b)=>b.y-a.y)}
function reset(){makeWorld();player={x:174,y:546,w:14,h:24,vx:0,vy:0,grounded:true,ground:platforms[0],coyote:0};camera=0;started=false;paused=false;dead=false;hooks=5;score=0;bestHeight=0;combo=0;comboFloors=0;comboTime=0;lastCamp=0;elapsed=0;scrollSpeed=11;checkpoint={level:0,score:0,bestHeight:0};flash='';flashTime=0;queued=null;overlay.style.display='none'}
function notice(s){flash=s;flashTime=1.4}function lose(){if(combo>=2)score+=comboFloors*comboFloors;combo=0;comboFloors=0;comboTime=0;if(hooks>0){hooks--;score=checkpoint.score;bestHeight=checkpoint.bestHeight;lastCamp=checkpoint.level;let p=platforms.find(p=>p.level===lastCamp);player={x:p.x+p.w/2-7,y:p.y-24,w:14,h:24,vx:0,vy:0,grounded:true,ground:p,coyote:0};camera=Math.min(0,p.y-390);started=false;paused=true;notice('RATUNEK! −1 HAK');showPanel('POWRÓT DO OBOZU',`Pozostałe haki: ${hooks}. Wynik cofnięty do stanu obozu.`, 'KONTYNUUJ',()=>{paused=false;overlay.style.display='none'})}else{dead=true;showPanel('KONIEC WYPRAWY',`Wysokość: ${bestHeight} m • Punkty: ${score}`, 'NOWA WYPRAWA',reset)}}
function showPanel(title,msg,btn,fn){overlay.style.display='flex';panel.innerHTML=`<h1>${title}</h1><small>${msg}</small><button id="action">${btn}</button>`;document.getElementById('action').onclick=fn}
function jump(dx,dy){if(paused||dead)return;let mag=Math.hypot(dx,dy);if(dy>-14){player.vx=clamp(player.vx+dx*.045,-205,205);return}let strength=clamp((-dy-15)/135,0,1);let dir=clamp(dx/90,-1,1);if(player.grounded||player.coyote>0){player.vy=-(285+strength*245+Math.min(65,Math.abs(player.vx)*.18));player.vx=clamp(player.vx+dir*(55+strength*115),-240,240);player.grounded=false;player.ground=null;player.coyote=0;started=true;paused=false}else{queued={dx,dy,ttl:.115};player.vx=clamp(player.vx+dir*55,-240,240)}}
function step(dt){if(dead||paused)return;flashTime=Math.max(0,flashTime-dt);if(queued){queued.ttl-=dt;if(queued.ttl<=0)queued=null}if(started){elapsed+=dt;scrollSpeed=11+Math.min(42,elapsed*.65);camera-=scrollSpeed*dt}if(comboTime>0){comboTime-=dt;if(comboTime<=0){if(combo>=2){score+=comboFloors*comboFloors;notice(`COMBO +${comboFloors*comboFloors}`)}combo=0;comboFloors=0}}
let wasGrounded=player.grounded,oldBottom=player.y+player.h;player.coyote=wasGrounded?.095:Math.max(0,player.coyote-dt);player.vy+=800*dt;player.y+=player.vy*dt;player.x+=player.vx*dt;player.vx*=Math.exp(-(wasGrounded?7.5:1.0)*dt);if(player.x<17){player.x=17;player.vx=Math.abs(player.vx)*.84}if(player.x+player.w>W-17){player.x=W-17-player.w;player.vx=-Math.abs(player.vx)*.84}
player.grounded=false;let landed=null;if(player.vy>=0){for(const p of platforms){if(oldBottom<=p.y+5&&player.y+player.h>=p.y&&player.x+player.w>p.x+4&&player.x<p.x+p.w-4){if(!landed||p.y<landed.y)landed=p}}}if(landed){player.y=landed.y-player.h;player.vy=0;player.grounded=true;player.ground=landed;if(!wasGrounded){const h=landed.level;if(h>bestHeight){score+=h-bestHeight;bestHeight=h;}let climbed=h-(player.takeoffLevel??0);if(climbed>=2){combo++;comboFloors+=climbed;comboTime=2.0;notice(`SKOK +${climbed} • COMBO ${combo}`)}else if(combo){if(combo>=2)score+=comboFloors*comboFloors;combo=0;comboFloors=0;comboTime=0}if(landed.camp&&landed.level>lastCamp){lastCamp=landed.level;checkpoint={level:lastCamp,score,bestHeight};paused=true;showPanel(`OBÓZ • ${lastCamp} m`,`Punkty zapisane: ${score}. Haki: ${hooks}/5. Kamera zatrzymana.`, 'RUSZAJ DALEJ',()=>{paused=false;overlay.style.display='none'});notice('OBÓZ ZDOBYTY')}}if(queued){let q=queued;queued=null;jump(q.dx,q.dy)}}if(player.grounded)player.takeoffLevel=player.ground.level;
let playerTop=player.y-camera;if(playerTop<105)camera=player.y-105;if(player.y>camera+H+30)lose();}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b2036';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);ctx.fillStyle='#6a9bb6';ctx.fillRect(0,0,W,H);for(let k=0;k<4;k++){let base=370+k*90+((camera*.07*(k+1))%80);ctx.fillStyle=['#3b6483','#4c7793','#7397aa','#9cb6c1'][k];ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=24)ctx.lineTo(x,base-35*Math.sin(x*.018+k*2)-18*Math.cos(x*.055+k));ctx.lineTo(W,H);ctx.fill()}
ctx.save();ctx.translate(0,-camera);ctx.fillStyle='#233d50';ctx.fillRect(0,camera-30,17,H+60);ctx.fillRect(W-17,camera-30,17,H+60);for(const p of platforms){if(p.y<camera-20||p.y>camera+H+20)continue;ctx.fillStyle=p.camp?'#e6b95d':'#314c61';ctx.fillRect(Math.round(p.x),p.y,Math.round(p.w),11);ctx.fillStyle=p.camp?'#fff0b1':'#e0f1f5';ctx.fillRect(Math.round(p.x),p.y,Math.round(p.w),4);if(p.camp){ctx.fillStyle='#ef865c';ctx.fillRect(p.x+7,p.y-18,3,18);ctx.fillRect(p.x+10,p.y-18,16,10)}}ctx.fillStyle='#f6b56b';ctx.fillRect(Math.round(player.x+3),Math.round(player.y),9,9);ctx.fillStyle='#e25f42';ctx.fillRect(Math.round(player.x+1),Math.round(player.y+9),13,11);ctx.fillStyle='#1b3045';ctx.fillRect(Math.round(player.x+2),Math.round(player.y+20),4,4);ctx.fillRect(Math.round(player.x+9),Math.round(player.y+20),4,4);ctx.restore();ctx.setTransform(1,0,0,1,0,0);uiL.innerHTML=`🏔 ${bestHeight} m<br>⭐ ${score} pkt${combo?`<br>⚡ COMBO ${combo} (+${comboFloors})`:''}`;uiR.innerHTML=`🪝 ${hooks}/5<br>⛺ ${lastCamp} m`;if(flashTime>0){ctx.setTransform(scale,0,0,scale,ox,oy);ctx.fillStyle='#fff1c5';ctx.textAlign='center';ctx.font='bold 16px monospace';ctx.fillText(flash,W/2,175)} }
let t=0;function loop(now){if(!last)last=now;acc+=Math.min(.05,(now-last)/1000);last=now;let count=0;while(acc>=1/120&&count++<8){step(1/120);acc-=1/120}draw();requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);gesture={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),fired:false}});canvas.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;e.preventDefault();let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.fired&&dy< -22){gesture.fired=true;gesture.initialDx=dx;gesture.initialDy=dy;gesture.jumpAt=performance.now();}if(gesture.fired&&performance.now()-gesture.jumpAt<115){gesture.initialDx=dx;gesture.initialDy=dy}let delta=e.clientX-gesture.lx;if(gesture.fired&&Math.abs(delta)>1)player.vx=clamp(player.vx+delta*.8,-240,240);gesture.lx=e.clientX;gesture.ly=e.clientY});canvas.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;e.preventDefault();let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(gesture.fired||dy< -15)jump(dx,dy);else if(Math.abs(dx)>10)player.vx=clamp(player.vx+dx*.9,-240,240);gesture=null});canvas.addEventListener('pointercancel',()=>gesture=null);document.getElementById('start').onclick=reset;reset();overlay.style.display='flex';requestAnimationFrame(loop);
})();</script></body></html>
