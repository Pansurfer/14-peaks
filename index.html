// Geometry-only route edition. Base physics, metres, camp frequency and IDs stay unchanged.
function makeWorldV08(){
 const random=seededRandom(routeSeed+':v08'+(MOUNTAIN.id==='shishapangma'?'':':'+MOUNTAIN.id));
 platforms=[{x:75,y:570,w:210,camp:true,level:0,variant:0,mode:'warmup',zone:0}];
 let direction=random()<.5?-1:1;
 const summitY=WORLD_ORIGIN-MOUNTAIN.height*UNITS_PER_METER;
 // Three authored phrases: precision / switchbacks / shortcuts / breath / finale.
 const phrases=[
  ['warmup','warmup','warmup','precision','precision','precision','zigzag','zigzag','zigzag','zigzag','shortcut','shortcut','shortcut','shortcut','breath','breath','precision','precision','zigzag','zigzag','finale','finale','finale','breath','camp'],
  ['breath','precision','precision','zigzag','zigzag','zigzag','shortcut','shortcut','shortcut','shortcut','precision','precision','long','long','long','breath','breath','zigzag','zigzag','zigzag','finale','finale','finale','breath','camp'],
  ['breath','zigzag','zigzag','precision','precision','shortcut','shortcut','shortcut','shortcut','long','long','breath','precision','precision','zigzag','zigzag','shortcut','shortcut','shortcut','shortcut','finale','finale','finale','breath','camp']
 ];
 for(let i=1;platforms[i-1].y>summitY;i++){
  const previous=platforms[i-1],section=Math.floor((i-1)/25),beat=(i-1)%25,altitude=(WORLD_ORIGIN-previous.y)/UNITS_PER_METER;
  const zone=clamp(Math.floor(altitude/MOUNTAIN.height*4),0,3);
  const mode=i<=75?phrases[section][beat]:beat<4?'breath':beat<10?'precision':beat<16?'zigzag':beat<20?'shortcut':beat<24?'finale':'camp';
  // Pressure grows over the whole mountain, with recovery inside each phrase.
  const progress=clamp(altitude/MOUNTAIN.height,0,1),wave=.5-.5*Math.cos(beat/24*Math.PI*2);
  const pressure=clamp(.12+progress*.50+wave*.32,0,1),intro=Math.min(section,2);
  let gap,width,travel;
  if(mode==='warmup'){gap=48+random()*6;width=126-random()*10;travel=25+random()*15}
  else if(mode==='precision'){gap=57+random()*7+progress*10;width=86-random()*10-pressure*13;travel=37+random()*16}
  else if(mode==='zigzag'){gap=69+random()*8+pressure*14;width=98-random()*12-pressure*14;travel=75+random()*13+pressure*14;direction*=-1}
  else if(mode==='shortcut'){gap=57+random()*7+progress*5;width=95-random()*10-pressure*14;travel=58+random()*13;direction*=-1}
  else if(mode==='long'){gap=104+random()*9+intro*3;width=102-random()*10;travel=88+random()*12}
  else if(mode==='finale'){gap=89+random()*11+pressure*19;width=94-random()*10-pressure*14;travel=88+random()*13+pressure*15;direction*=-1}
  else {gap=51+random()*8;width=125-random()*9;travel=30+random()*18}
  const camp=i%25===0;
  if(camp){gap=62;width=144;travel=38}
  gap=Math.round(gap);width=Math.round(width);
  const remaining=previous.y-summitY,summit=remaining<=gap;
  if(summit){gap=remaining;width=180;travel=35}else if(remaining-gap<30){gap=Math.floor(remaining/2)}
  travel=Math.min(travel,flightFactor(gap)*145);
  const center=previous.x+previous.w/2,minCenter=22+width/2,maxCenter=W-22-width/2;
  if(center+direction*travel<minCenter||center+direction*travel>maxCenter)direction*=-1;
  let nextCenter=clamp(center+direction*travel,minCenter,maxCenter);
  // A switchback's upper target returns close to the lower takeoff point.
  // Thus a full ordinary gesture can skip its intermediate ledge; it is optional.
  if(mode==='shortcut'&&i>1&&previous.mode==='shortcut'){
   const lower=platforms[i-2],skipGap=lower.y-(previous.y-gap),skipCenter=lower.x+lower.w/2;
   const skipReach=flightFactor(skipGap)*145;
   const low=Math.max(minCenter,center-flightFactor(gap)*145,skipCenter-skipReach);
   const high=Math.min(maxCenter,center+flightFactor(gap)*145,skipCenter+skipReach);
   if(low<=high)nextCenter=clamp(nextCenter,low,high);
  }
  const target={x:Math.round(nextCenter-width/2),y:previous.y-gap,w:width,camp:camp||summit,summit,level:i,variant:Math.floor(random()*3),mode,zone};
  if(!summit){
   if(i===3)target.pickup='pack';
   else if([7,18,38,63].includes(i)||(i>75&&i%53===18))target.pickup='ration';
   else if([14,32,54,70].includes(i)||(i>75&&i%71===32))target.pickup='axe';
   // Short summits still receive oxygen: first eligible ledge above 8000 m.
   if((WORLD_ORIGIN-target.y)/UNITS_PER_METER>=8000&&((WORLD_ORIGIN-previous.y)/UNITS_PER_METER<8000||i%40===12))target.pickup='oxygen';
  }
  platforms.push(target);
 }
}

function seededRandom(text){let h=2166136261;for(let i=0;i<text.length;i++){h=Math.imul(h^text.charCodeAt(i),16777619)}return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
// Match the unchanged 120 Hz physics. This is the horizontal travel factor
// at descending contact for a gesture peaking 24 px above the target from rest.
function flightFactor(gap){let y=0,vy=-Math.max(285,Math.sqrt(1600*(gap+24))),factor=0,vx=1;const dt=1/120;for(let n=0;n<240;n++){let old=y;vy+=800*dt;y+=vy*dt;factor+=vx*dt;vx*=Math.exp(-dt);if(vy>=0&&old<=-gap+5&&y>=-gap)return factor}throw new Error('Unreachable platform gap')}
function makeWorldLegacy(){const random=seededRandom(routeSeed+(MOUNTAIN.id==='shishapangma'?'':':'+MOUNTAIN.id));platforms=[{x:75,y:570,w:210,camp:true,level:0,variant:0}];let direction=random()<.5?-1:1;
for(let i=1;platforms[i-1].y>WORLD_ORIGIN-MOUNTAIN.height*UNITS_PER_METER;i++){
 const previous=platforms[i-1],section=Math.floor((i-1)/25),beat=(i-1)%25;
 // Each camp begins a new wave: warm-up, zigzag, long jumps, recovery.
 const mode=beat<5?'warmup':beat<14?'zigzag':beat<21?'long':'recovery';
 const progress=Math.min(1,section/7),wave=.5-.5*Math.cos(beat/24*Math.PI*2);
 const pressure=clamp(.18+progress*.40+wave*.42,0,1),camp=i%25===0;
 let gap,width,travel;
 if(mode==='warmup'){gap=52+random()*14+progress*9;width=112-random()*18-progress*12;travel=32+random()*32}
 else if(mode==='zigzag'){gap=66+random()*17+pressure*12;width=102-random()*22-pressure*12;travel=64+random()*28+pressure*18;direction*=-1}
 else if(mode==='long'){gap=82+random()*16+pressure*15;width=94-random()*18-pressure*12;travel=92+random()*18+pressure*14}
 else {gap=57+random()*17;width=112-random()*16;travel=38+random()*32}
 if(camp){width=144;gap=62;travel=45}
 gap=Math.round(gap);width=Math.round(width);
 const remaining=previous.y-(WORLD_ORIGIN-MOUNTAIN.height*UNITS_PER_METER),summit=remaining<=gap;
 if(summit){gap=remaining;width=180;travel=35}else if(remaining-gap<30){gap=Math.floor(remaining/2)}
 // Keep a margin below the 170 px/s full-gesture impulse. Side gestures
 // and retained momentum are never necessary to reach the next platform.
 travel=Math.min(travel,flightFactor(gap)*145);
 const center=previous.x+previous.w/2,minCenter=22+width/2,maxCenter=W-22-width/2;
 if(center+direction*travel<minCenter||center+direction*travel>maxCenter)direction*=-1;
 const nextCenter=clamp(center+direction*travel,minCenter,maxCenter);
 platforms.push({x:Math.round(nextCenter-width/2),y:previous.y-gap,w:width,camp:camp||summit,summit,level:i,variant:Math.floor(random()*3),mode});
}}

function reset(){makeWorld();resetInventory();player={x:174,y:546,w:14,h:24,vx:0,vy:0,grounded:true,ground:platforms[0],coyote:0,takeoffLevel:0};camera=0;started=false;paused=false;dead=false;maxHooks=options.hookCount;hooks=maxHooks;score=0;bestHeight=0;bestLevel=0;won=false;inRun=true;clearCombo();lastCamp=0;elapsed=0;scrollSpeed=11;checkpoint={level:0,score:0,bestHeight:0,bestLevel:0,items:inventorySnapshot()};flash='';flashTime=0;queued=null;overlay.style.display='none'}

function showPanel(title,msg,btn,fn,cancel=false){overlay.style.display='flex';panel.className='dialog-panel';panel.innerHTML=`<h1>${title}</h1><small>${msg}</small><button id="action">${btn}</button>`;document.getElementById('action').onclick=fn;if(cancel){const back=document.createElement('button');back.textContent='WRÓĆ';back.className='secondary';back.style.marginTop='10px';back.onclick=showSavedChoice;panel.appendChild(back)}}
function jump(dx,dy){if(paused||dead)return;let mag=Math.hypot(dx,dy);if(dy>-14){player.vx=clamp(player.vx+dx*.045,-205,205);return}let strength=clamp((-dy-15)/135,0,1);let dir=clamp(dx/90,-1,1);if(player.grounded||player.coyote>0){player.vy=-(285+strength*245+Math.min(65,Math.abs(player.vx)*.18))*jumpMultiplier();jumpFeedback();player.vx=clamp(player.vx+dir*(55+strength*115),-240,240);player.grounded=false;player.ground=null;player.coyote=0;started=true;paused=false}else{queued={dx,dy,ttl:.115};player.vx=clamp(player.vx+dir*55,-240,240)}}
function step(dt){if(dead||paused||won)return;flashTime=Math.max(0,flashTime-dt);stepHUD(dt);stepItems(dt);stepPresentation(dt);if(queued){queued.ttl-=dt;if(queued.ttl<=0)queued=null}if(started){elapsed+=dt;scrollSpeed=11+Math.min(42,elapsed*.65);camera-=scrollSpeed*dt}if(isComboActive){comboTimer-=dt;if(comboTimer<=0)endCombo()}
let wasGrounded=player.grounded,oldBottom=player.y+player.h;player.coyote=wasGrounded?.095:Math.max(0,player.coyote-dt);player.vy+=800*dt;player.y+=player.vy*dt;player.x+=player.vx*dt;player.vx*=Math.exp(-(wasGrounded?7.5:1.0)*dt);if(player.x<17){player.x=17;player.vx=Math.abs(player.vx)*.84}if(player.x+player.w>W-17){player.x=W-17-player.w;player.vx=-Math.abs(player.vx)*.84}
player.grounded=false;let landed=null;if(player.vy>=0){for(const p of nearbyPlatforms(oldBottom-5,player.y+player.h)){if(oldBottom<=p.y+5&&player.y+player.h>=p.y&&player.x+player.w>p.x+4&&player.x<p.x+p.w-4){if(!landed||p.y<landed.y)landed=p}}}if(landed){player.y=landed.y-player.h;player.vy=0;player.grounded=true;player.ground=landed;if(!wasGrounded){collectLandingItems(landed);landFeedback(Math.max(0,landed.level-player.takeoffLevel-1));scoreLanding(landed);if(landed.summit){finishSummit();return}if(landed.camp&&landed.level>lastCamp){lastCamp=landed.level;endCombo(false);checkpoint={level:lastCamp,score,bestHeight,bestLevel,items:inventorySnapshot()};persistCamp();paused=true;showCampPanel();notice(storageAvailable?'OBÓZ ZAPISANY':'OBÓZ ZDOBYTY · BRAK ZAPISU')}}if(queued){let q=queued;queued=null;jump(q.dx,q.dy)}}if(player.grounded)player.takeoffLevel=player.ground.level;
let playerTop=player.y-camera;if(playerTop<105)camera=player.y-105;if(player.y>camera+H+30)lose();}

ctx.save();ctx.translate(0,-camera);ctx.fillStyle='#233d50';ctx.fillRect(0,camera-30,17,H+60);ctx.fillRect(W-17,camera-30,17,H+60);for(const p of nearbyPlatforms(camera-20,camera+H+20)){if(p.y<camera-20||p.y>camera+H+20)continue;ctx.fillStyle=p.camp?'#e6b95d':['#314c61','#435969','#395d65'][p.variant||0];ctx.fillRect(Math.round(p.x),p.y,Math.round(p.w),11);ctx.fillStyle=p.camp?'#fff0b1':'#e0f1f5';ctx.fillRect(Math.round(p.x),p.y,Math.round(p.w),4);if(!p.camp){ctx.fillStyle=['#58748a','#73828d','#698f94'][p.variant||0];for(let mark=p.x+9;mark<p.x+p.w-5;mark+=p.variant===1?21:29)ctx.fillRect(Math.round(mark),p.y+6,p.variant===2?8:4,2)}if(p.camp){ctx.fillStyle='#ef865c';ctx.fillRect(p.x+7,p.y-18,3,18);ctx.fillRect(p.x+10,p.y-18,16,10)}}drawJumpGuide();drawItemPickups();drawPlayerPresentation();ctx.restore();ctx.setTransform(1,0,0,1,0,0);uiL.innerHTML=`🏔 ${meterText(bestHeight)} m<br>⭐ ${score} pkt`;uiR.innerHTML=`🪝 ${hooks}/${maxHooks}<br>⛺ ${meterText(meters(platforms[lastCamp]))} m${nearGoalText()}`;if(flashTime>0){ctx.setTransform(scale,0,0,scale,ox,oy);ctx.fillStyle='#fff1c5';ctx.textAlign='center';ctx.font='bold 16px monospace';ctx.fillText(flash,W/2,175)} }
