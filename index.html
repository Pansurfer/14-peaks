<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14283c"><title>14 Peaks v0.7b</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10243a;color:#fff;font:14px system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}#ui{position:fixed;top:env(safe-area-inset-top);left:0;right:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;text-shadow:1px 2px #142338;font-weight:800}#right{text-align:right}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#081727b8;padding:20px}#panel{max-width:360px;background:#1d354c;border:3px solid #a4c8d8;padding:20px;text-align:center;box-shadow:7px 7px #081727}button{font:700 17px system-ui;padding:12px 22px;background:#e7b75c;color:#162637;border:0;cursor:pointer}small{line-height:1.6;display:block;color:#d2e1e9;margin:12px 0}#hint{position:fixed;bottom:16px;width:100%;text-align:center;pointer-events:none;color:#e4edf5;text-shadow:1px 2px #10243a;font-size:12px}.actions{display:grid;gap:10px}.secondary{background:#b9d1de}.option{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 0;font-size:16px}.option input{width:24px;height:24px;accent-color:#e7b75c}#panel{width:100%;max-height:calc(100dvh - 40px);overflow:auto;touch-action:auto}#menu{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);font-size:12px;padding:8px 12px;background:#1d354c;color:#fff;border:1px solid #a4c8d8}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="left"></div><div id="right"></div></div><button id="menu" aria-label="Menu gry">MENU</button><div id="hint">Przesuń palcem ↗ ↑ ↖ — długość = siła • gesty ← → korygują lot</div><div id="overlay"><div id="panel"><h1>🏔 14 PEAKS</h1><p>KLASYCZNE ARCADE • v0.7a</p><small>Gest ukośnie w górę = skok i kierunek. Dłuższy gest = mocniejszy skok. Przesuwaj palcem w bok, by sterować w locie. Kamera rusza przy pierwszym skoku. Obozy zatrzymują czas. Masz 5 ratunków.</small><button id="start">START</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),uiL=document.getElementById('left'),uiR=document.getElementById('right'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');const W=360,H=640,PH=46;let scale=1,ox=0,oy=0;function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();let platforms=[],player,camera,started,paused,dead,hooks,score,bestHeight,combo,comboFloors,comboTime,checkpoint,lastCamp,elapsed,scrollSpeed,flash='',flashTime=0,gesture=null,queued=null,acc=0,last=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const rand=n=>{let x=Math.sin(n*127.1+13.7)*43758.5453;return x-Math.floor(x)};
// Seed is a route identifier; the same seed reproduces all platforms.
const routeSeed=(new URLSearchParams(location.search).get('seed')||'14-peaks-v07a').slice(0,128);
// v0.7b: UI and persistence, separate from gestures and jump integration.
const MOUNTAIN={id:'shishapangma',name:'Sziszapangma',height:8027};
const WORLD_ORIGIN=570,UNITS_PER_METER=46;
let bestLevel=0,won=false,inRun=false,savedRun=null,storageAvailable=true;
const storageKey=()=> '14peaks:v07b:'+MOUNTAIN.id+':'+routeSeed;
function readStored(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}
function writeStored(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){storageAvailable=false;return false}}
const options={nearGoal:readStored('14peaks:options:v1')?.nearGoal===true};
const storedSummits=readStored('14peaks:summits:v1');
const conquered=Array.isArray(storedSummits)?storedSummits.filter(id=>typeof id==='string'):[];
const meters=p=>Math.max(0,(WORLD_ORIGIN-p.y)/UNITS_PER_METER);
const meterText=n=>Math.floor(n).toLocaleString('pl-PL');
// Platforms are ordered from bottom to top; visit only the relevant slice.
function nearbyPlatforms(top,bottom){let lo=0,hi=platforms.length;while(lo<hi){const mid=(lo+hi)>>>1;if(platforms[mid].y>bottom)lo=mid+1;else hi=mid}let end=lo;while(end<platforms.length&&platforms[end].y>=top)end++;return platforms.slice(lo,end)}
function refreshSaved(){const data=readStored(storageKey());savedRun=null;if(!data||data.version!==1||data.seed!==routeSeed||data.mountain!==MOUNTAIN.id)return;
 const p=platforms[data.level];
 if(!p||!p.camp||!Number.isInteger(data.level)||!Number.isInteger(data.hooks)||data.hooks<0||data.hooks>5||!Number.isSafeInteger(data.score)||data.score<0||!Number.isFinite(data.elapsed)||data.elapsed<0||typeof data.complete!=='boolean'||data.complete!==!!p.summit)return;
 savedRun=data;
}
function persistCamp(){const data={version:1,mountain:MOUNTAIN.id,seed:routeSeed,level:checkpoint.level,score:checkpoint.score,hooks,elapsed,complete:won};if(writeStored(storageKey(),data))savedRun=data}
function clearSaved(){savedRun=null;try{localStorage.removeItem(storageKey())}catch(e){storageAvailable=false}}
function resumePlay(){paused=false;gesture=null;queued=null;overlay.style.display='none';last=0;acc=0}
function beginNewTrip(){clearSaved();reset();persistCamp()}
function restoreTrip(){refreshSaved();if(!savedRun||savedRun.complete){showMenu();return}const saved=savedRun;reset();const p=platforms[saved.level];
 player={x:p.x+p.w/2-7,y:p.y-24,w:14,h:24,vx:0,vy:0,grounded:true,ground:p,coyote:0,takeoffLevel:p.level};
 camera=Math.min(0,p.y-390);score=saved.score;bestLevel=p.level;bestHeight=meters(p);hooks=saved.hooks;lastCamp=p.level;elapsed=saved.elapsed;scrollSpeed=11+Math.min(42,elapsed*.65);checkpoint={level:p.level,score,bestHeight,bestLevel};started=false;resumePlay();notice('WYPRAWA WZNOWIONA');
}
function showMenu(){paused=true;gesture=null;queued=null;overlay.style.display='flex';refreshSaved();
 panel.innerHTML='<h1>🏔 14 PEAKS</h1><p>KLASYCZNE ARCADE • v0.7b</p><p>Sziszapangma · 8 027 m</p><small>Korona Himalajów i Karakorum<br>Pierwsza wyprawa · 5 haków</small><div class="actions"><button id="play">ZAGRAJ</button><button id="options" class="secondary">OPCJE</button></div><small id="save-info"></small>';
 const info=document.getElementById('save-info');
 info.textContent=!storageAvailable?'Zapis w tej przeglądarce jest niedostępny.':savedRun?.complete?'Sziszapangma zdobyta!':savedRun?'Zapisany obóz: '+meterText(meters(platforms[savedRun.level]))+' m.':conquered.includes(MOUNTAIN.id)?'Sziszapangma zdobyta! Możesz powtórzyć wyprawę.':'Postęp zapisuje się w obozach na tym urządzeniu.';
 document.getElementById('play').onclick=()=>{if(inRun&&!dead&&!won)resumePlay();else if(savedRun&&!savedRun.complete)showSavedChoice();else beginNewTrip()};
 document.getElementById('options').onclick=showOptions;
}
function showSavedChoice(){panel.innerHTML='<h1>WRÓĆ NA SZLAK</h1><small id="resume-info"></small><div class="actions"><button id="resume">KONTYNUUJ WYPRAWĘ</button><button id="new-trip" class="secondary">NOWA WYPRAWA</button><button id="back" class="secondary">WRÓĆ</button></div>';
 document.getElementById('resume-info').textContent='Obóz: '+meterText(meters(platforms[savedRun.level]))+' m · Haki: '+savedRun.hooks+'/5';
 document.getElementById('resume').onclick=restoreTrip;
 document.getElementById('new-trip').onclick=()=>showPanel('NOWA WYPRAWA','Zastąpi zapisany postęp na tej trasie.','ROZPOCZNIJ OD NOWA',beginNewTrip,true);
 document.getElementById('back').onclick=showMenu;
}
function showOptions(){panel.innerHTML='<h1>OPCJE</h1><label class="option"><input id="near-goal-toggle" type="checkbox"> <span>Pokazuj bliski cel</span></label><small>Wyświetla metry do następnego obozu. Nie zmienia trasy ani trudności.</small><button id="back">WRÓĆ</button>';
 const toggle=document.getElementById('near-goal-toggle');toggle.checked=options.nearGoal;toggle.onchange=()=>{options.nearGoal=toggle.checked;writeStored('14peaks:options:v1',options)};
 document.getElementById('back').onclick=showMenu;
}
function nearGoalText(){if(!options.nearGoal||won)return '';let next=platforms.find(p=>p.camp&&meters(p)>bestHeight);return next?'<br>🎯 '+(next.summit?'Do szczytu: ':'Do obozu: ')+Math.ceil(meters(next)-bestHeight)+' m':''}
function finishSummit(){if(won)return;if(combo>=2)score+=comboFloors*comboFloors;combo=0;comboFloors=0;comboTime=0;won=true;paused=true;lastCamp=player.ground.level;checkpoint={level:lastCamp,score,bestHeight,bestLevel};if(!conquered.includes(MOUNTAIN.id)){conquered.push(MOUNTAIN.id);writeStored('14peaks:summits:v1',conquered)}persistCamp();showPanel('SZCZYT ZDOBYTY!','Sziszapangma · 8 027 m. Punkty: '+score+'. Pierwszy szczyt wyprawy 14 Peaks!','WRÓĆ DO MENU',showMenu)}
document.getElementById('menu').onclick=showMenu;
addEventListener('pagehide',()=>{if(inRun&&!dead)persistCamp()});
// Returning from a backgrounded phone tab never advances the camera silently.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&inRun&&!dead&&!won){persistCamp();showMenu()}});

function seededRandom(text){let h=2166136261;for(let i=0;i<text.length;i++){h=Math.imul(h^text.charCodeAt(i),16777619)}return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
// Match the unchanged 120 Hz physics. This is the horizontal travel factor
// at descending contact for a gesture peaking 24 px above the target from rest.
function flightFactor(gap){let y=0,vy=-Math.max(285,Math.sqrt(1600*(gap+24))),factor=0,vx=1;const dt=1/120;for(let n=0;n<240;n++){let old=y;vy+=800*dt;y+=vy*dt;factor+=vx*dt;vx*=Math.exp(-dt);if(vy>=0&&old<=-gap+5&&y>=-gap)return factor}throw new Error('Unreachable platform gap')}
function makeWorld(){const random=seededRandom(routeSeed);platforms=[{x:75,y:570,w:210,camp:true,level:0,variant:0}];let direction=random()<.5?-1:1;
for(let i=1;platforms[i-1].y>WORLD_ORIGIN-MOUNTAIN.height*UNITS_PER_METER;i++){
 const previous=platforms[i-1],section=Math.floor((i-1)/25),beat=(i-1)%25;
 // Each camp begins a new wave: warm-up, zigzag, long jumps, recovery.
 const mode=beat<5?'warmup':beat<14?'zigzag':beat<21?'long':'recovery';
 const progress=Math.min(1,section/7),wave=.5-.5*Math.cos(beat/24*Math.PI*2);
 const pressure=clamp(.18+progress*.40+wave*.42,0,1),camp=i%25===0;
 let gap,width,travel;
 if(mode==='warmup'){gap=52+random()*14+progress*9;width=112-random()*18-progress*12;travel=32+random()*32}
 else if(mode==='zigzag'){gap=66+random()*17+pressure*12;width=102-random()*22-pressure*12;travel=64+random()*28+pressure*18;direction*=-1}
 else if(mode==='long'){gap=82+random()*16+pressure*15;width=94-random()*18-pressure*12;travel=92+random()*18+pressure*14}
 else {gap=57+random()*17;width=112-random()*16;travel=38+random()*32}
 if(camp){width=144;gap=62;travel=45}
 gap=Math.round(gap);width=Math.round(width);
 const remaining=previous.y-(WORLD_ORIGIN-MOUNTAIN.height*UNITS_PER_METER),summit=remaining<=gap;
 if(summit){gap=remaining;width=180;travel=35}else if(remaining-gap<30){gap=Math.floor(remaining/2)}
 // Keep a margin below the 170 px/s full-gesture impulse. Side gestures
 // and retained momentum are never necessary to reach the next platform.
 travel=Math.min(travel,flightFactor(gap)*145);
 const center=previous.x+previous.w/2,minCenter=22+width/2,maxCenter=W-22-width/2;
 if(center+direction*travel<minCenter||center+direction*travel>maxCenter)direction*=-1;
 const nextCenter=clamp(center+direction*travel,minCenter,maxCenter);
 platforms.push({x:Math.round(nextCenter-width/2),y:previous.y-gap,w:width,camp:camp||summit,summit,level:i,variant:Math.floor(random()*3),mode});
}}

function reset(){makeWorld();player={x:174,y:546,w:14,h:24,vx:0,vy:0,grounded:true,ground:platforms[0],coyote:0};camera=0;started=false;paused=false;dead=false;hooks=5;score=0;bestHeight=0;bestLevel=0;won=false;inRun=true;combo=0;comboFloors=0;comboTime=0;lastCamp=0;elapsed=0;scrollSpeed=11;checkpoint={level:0,score:0,bestHeight:0,bestLevel:0};flash='';flashTime=0;queued=null;overlay.style.display='none'}
function notice(s){flash=s;flashTime=1.4}function lose(){if(combo>=2)score+=comboFloors*comboFloors;combo=0;comboFloors=0;comboTime=0;if(hooks>0){hooks--;score=checkpoint.score;bestHeight=checkpoint.bestHeight;bestLevel=checkpoint.bestLevel;lastCamp=checkpoint.level;let p=platforms.find(p=>p.level===lastCamp);player={x:p.x+p.w/2-7,y:p.y-24,w:14,h:24,vx:0,vy:0,grounded:true,ground:p,coyote:0};camera=Math.min(0,p.y-390);started=false;paused=true;persistCamp();notice('RATUNEK! −1 HAK');showPanel('POWRÓT DO OBOZU',`Pozostałe haki: ${hooks}. Wynik cofnięty do stanu obozu.`, 'KONTYNUUJ',()=>{paused=false;overlay.style.display='none'})}else{dead=true;clearSaved();showPanel('KONIEC WYPRAWY',`Wysokość: ${meterText(bestHeight)} m • Punkty: ${score}`, 'NOWA WYPRAWA',beginNewTrip)}}
function showPanel(title,msg,btn,fn,cancel=false){overlay.style.display='flex';panel.innerHTML=`<h1>${title}</h1><small>${msg}</small><button id="action">${btn}</button>`;document.getElementById('action').onclick=fn;if(cancel){const back=document.createElement('button');back.textContent='WRÓĆ';back.className='secondary';back.style.marginTop='10px';back.onclick=showSavedChoice;panel.appendChild(back)}}
function jump(dx,dy){if(paused||dead)return;let mag=Math.hypot(dx,dy);if(dy>-14){player.vx=clamp(player.vx+dx*.045,-205,205);return}let strength=clamp((-dy-15)/135,0,1);let dir=clamp(dx/90,-1,1);if(player.grounded||player.coyote>0){player.vy=-(285+strength*245+Math.min(65,Math.abs(player.vx)*.18));player.vx=clamp(player.vx+dir*(55+strength*115),-240,240);player.grounded=false;player.ground=null;player.coyote=0;started=true;paused=false}else{queued={dx,dy,ttl:.115};player.vx=clamp(player.vx+dir*55,-240,240)}}
function step(dt){if(dead||paused||won)return;flashTime=Math.max(0,flashTime-dt);if(queued){queued.ttl-=dt;if(queued.ttl<=0)queued=null}if(started){elapsed+=dt;scrollSpeed=11+Math.min(42,elapsed*.65);camera-=scrollSpeed*dt}if(comboTime>0){comboTime-=dt;if(comboTime<=0){if(combo>=2){score+=comboFloors*comboFloors;notice(`COMBO +${comboFloors*comboFloors}`)}combo=0;comboFloors=0}}
let wasGrounded=player.grounded,oldBottom=player.y+player.h;player.coyote=wasGrounded?.095:Math.max(0,player.coyote-dt);player.vy+=800*dt;player.y+=player.vy*dt;player.x+=player.vx*dt;player.vx*=Math.exp(-(wasGrounded?7.5:1.0)*dt);if(player.x<17){player.x=17;player.vx=Math.abs(player.vx)*.84}if(player.x+player.w>W-17){player.x=W-17-player.w;player.vx=-Math.abs(player.vx)*.84}
player.grounded=false;let landed=null;if(player.vy>=0){for(const p of nearbyPlatforms(oldBottom-5,player.y+player.h)){if(oldBottom<=p.y+5&&player.y+player.h>=p.y&&player.x+player.w>p.x+4&&player.x<p.x+p.w-4){if(!landed||p.y<landed.y)landed=p}}}if(landed){player.y=landed.y-player.h;player.vy=0;player.grounded=true;player.ground=landed;if(!wasGrounded){const h=landed.level;if(h>bestLevel){score+=h-bestLevel;bestLevel=h;}bestHeight=Math.max(bestHeight,meters(landed));let climbed=h-(player.takeoffLevel??0);if(climbed>=2){combo++;comboFloors+=climbed;comboTime=2.0;notice(`SKOK +${climbed} • COMBO ${combo}`)}else if(combo){if(combo>=2)score+=comboFloors*comboFloors;combo=0;comboFloors=0;comboTime=0}if(landed.summit){finishSummit();return}if(landed.camp&&landed.level>lastCamp){lastCamp=landed.level;checkpoint={level:lastCamp,score,bestHeight,bestLevel};persistCamp();paused=true;showPanel(`OBÓZ • ${meterText(meters(landed))} m`,`Punkty zapisane: ${score}. Haki: ${hooks}/5. Kamera zatrzymana.`, 'RUSZAJ DALEJ',()=>{paused=false;overlay.style.display='none'});notice(storageAvailable?'OBÓZ ZAPISANY':'OBÓZ ZDOBYTY · BRAK ZAPISU')}}if(queued){let q=queued;queued=null;jump(q.dx,q.dy)}}if(player.grounded)player.takeoffLevel=player.ground.level;
let playerTop=player.y-camera;if(playerTop<105)camera=player.y-105;if(player.y>camera+H+30)lose();}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b2036';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);ctx.fillStyle='#6a9bb6';ctx.fillRect(0,0,W,H);for(let k=0;k<4;k++){let base=370+k*90+((camera*.07*(k+1))%80);ctx.fillStyle=['#3b6483','#4c7793','#7397aa','#9cb6c1'][k];ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=24)ctx.lineTo(x,base-35*Math.sin(x*.018+k*2)-18*Math.cos(x*.055+k));ctx.lineTo(W,H);ctx.fill()}
ctx.save();ctx.translate(0,-camera);ctx.fillStyle='#233d50';ctx.fillRect(0,camera-30,17,H+60);ctx.fillRect(W-17,camera-30,17,H+60);for(const p of nearbyPlatforms(camera-20,camera+H+20)){if(p.y<camera-20||p.y>camera+H+20)continue;ctx.fillStyle=p.camp?'#e6b95d':['#314c61','#435969','#395d65'][p.variant||0];ctx.fillRect(Math.round(p.x),p.y,Math.round(p.w),11);ctx.fillStyle=p.camp?'#fff0b1':'#e0f1f5';ctx.fillRect(Math.round(p.x),p.y,Math.round(p.w),4);if(!p.camp){ctx.fillStyle=['#58748a','#73828d','#698f94'][p.variant||0];for(let mark=p.x+9;mark<p.x+p.w-5;mark+=p.variant===1?21:29)ctx.fillRect(Math.round(mark),p.y+6,p.variant===2?8:4,2)}if(p.camp){ctx.fillStyle='#ef865c';ctx.fillRect(p.x+7,p.y-18,3,18);ctx.fillRect(p.x+10,p.y-18,16,10)}}ctx.fillStyle='#f6b56b';ctx.fillRect(Math.round(player.x+3),Math.round(player.y),9,9);ctx.fillStyle='#e25f42';ctx.fillRect(Math.round(player.x+1),Math.round(player.y+9),13,11);ctx.fillStyle='#1b3045';ctx.fillRect(Math.round(player.x+2),Math.round(player.y+20),4,4);ctx.fillRect(Math.round(player.x+9),Math.round(player.y+20),4,4);ctx.restore();ctx.setTransform(1,0,0,1,0,0);uiL.innerHTML=`🏔 ${meterText(bestHeight)} m<br>⭐ ${score} pkt${combo?`<br>⚡ COMBO ${combo} (+${comboFloors})`:''}`;uiR.innerHTML=`🪝 ${hooks}/5<br>⛺ ${meterText(meters(platforms[lastCamp]))} m${nearGoalText()}`;if(flashTime>0){ctx.setTransform(scale,0,0,scale,ox,oy);ctx.fillStyle='#fff1c5';ctx.textAlign='center';ctx.font='bold 16px monospace';ctx.fillText(flash,W/2,175)} }
let t=0;function loop(now){if(!last)last=now;acc+=Math.min(.05,(now-last)/1000);last=now;let count=0;while(acc>=1/120&&count++<8){step(1/120);acc-=1/120}draw();requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);gesture={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),fired:false}});canvas.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;e.preventDefault();let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.fired&&dy< -22){gesture.fired=true;gesture.initialDx=dx;gesture.initialDy=dy;gesture.jumpAt=performance.now();}if(gesture.fired&&performance.now()-gesture.jumpAt<115){gesture.initialDx=dx;gesture.initialDy=dy}let delta=e.clientX-gesture.lx;if(gesture.fired&&Math.abs(delta)>1)player.vx=clamp(player.vx+delta*.8,-240,240);gesture.lx=e.clientX;gesture.ly=e.clientY});canvas.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;e.preventDefault();let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(gesture.fired||dy< -15)jump(dx,dy);else if(Math.abs(dx)>10)player.vx=clamp(player.vx+dx*.9,-240,240);gesture=null});canvas.addEventListener('pointercancel',()=>gesture=null);reset();inRun=false;showMenu();requestAnimationFrame(loop);
})();</script></body></html>
